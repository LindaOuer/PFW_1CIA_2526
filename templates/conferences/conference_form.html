{% extends 'base.html' %}

{% block title %}
<title>
     {% if form.instance.pk %}Edit Conference</title>
     {% else %}Create Conference</title>
     {% endif %}
{% endblock %}

{% block content %}
<h1>
    {% if form.instance.pk %}
    Edit Conference
    {% else %}
    Create a New Conference
    {% endif %}
</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">
        Submit
    </button>
</form>
{% endblock %}
