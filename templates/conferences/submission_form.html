{% extends "base.html" %}



{% block content %}
<h1>Add a new submission to {{ conference.name }}</h1>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Create Submission</button>
    <a href="{% url 'conference_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
